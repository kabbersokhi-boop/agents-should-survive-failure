name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --all-groups
      - run: make lint typecheck validate-evaluation-dataset test test-security dependency-audit sdk-build test-sdk-install external-agent-build test-external-agent sbom-backend sbom-sdk
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: backend-and-sdk-sboms
          path: |
            artifacts/backend.sbom.json
            artifacts/sdk.sbom.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: agents-control-plane:local
          push: false
          load: true
      - run: mkdir -p artifacts && docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro -v "$PWD/artifacts:/artifacts" anchore/syft:v1.31.0 agents-control-plane:local -o cyclonedx-json=/artifacts/container.sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: container-sbom
          path: artifacts/container.sbom.json

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --all-groups
      - run: make test-integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-evidence
          path: |
            artifacts/evaluations/*.json
            artifacts/evaluations/*.md
            artifacts/backend.sbom.json
            artifacts/sdk.sbom.json
            artifacts/container.sbom.json
          if-no-files-found: warn
