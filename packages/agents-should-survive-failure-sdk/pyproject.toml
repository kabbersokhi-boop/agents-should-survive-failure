[project]
name = "agents-should-survive-failure-sdk"
version = "1.0.0"
description = "Public typed contracts for Agents Should Survive Failure managed agents."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Kabir Sokhi" }]
dependencies = ["pydantic==2.11.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_should_survive_failure_sdk"]
