[project]
name = "reference-operations-agent"
version = "0.1.0"
description = "Reference operations investigation managed agent for Agents Should Survive Failure."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["agents-should-survive-failure-sdk>=0.1.0,<0.2.0"]

[tool.uv.sources]
agents-should-survive-failure-sdk = { path = "../agents-should-survive-failure-sdk" }

[project.entry-points."agents_should_survive_failure.agents"]
operations-investigation = "reference_operations_agent.agent:OperationsInvestigationAgent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reference_operations_agent"]
