[project]
name = "agents-should-survive-failure"
version = "0.1.0"
description = "A durable, observable and secure control plane for long-running AI agents."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Kabir Sokhi" }]
dependencies = [
  "agents-should-survive-failure-sdk==1.0.0",
  "alembic==1.16.5",
  "asyncpg==0.31.0",
  "fastapi==0.139.0",
  "mcp==1.28.1",
  "opentelemetry-api==1.39.1",
  "opentelemetry-exporter-otlp-proto-grpc==1.39.1",
  "opentelemetry-instrumentation-fastapi==0.60b1",
  "opentelemetry-instrumentation-sqlalchemy==0.60b1",
  "opentelemetry-sdk==1.39.1",
  "pgvector==0.4.1",
  "prometheus-client==0.23.1",
  "pydantic==2.11.7",
  "pydantic-settings==2.14.2",
  "sqlalchemy[asyncio]==2.0.45",
  "starlette==1.3.1",
  "structlog==25.5.0",
  "temporalio==1.30.0",
  "uvicorn[standard]==0.35.0",
]

[tool.uv.sources]
agents-should-survive-failure-sdk = { path = "packages/agents-should-survive-failure-sdk" }

[dependency-groups]
dev = [
  "coverage[toml]==7.10.2",
  "cyclonedx-bom==7.2.1",
  "httpx==0.28.1",
  "pip-audit==2.9.0",
  "pre-commit==4.3.0",
  "pyright==1.1.403",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_should_survive_failure"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "strict"
markers = [
  "integration: requires the local Docker Compose stack",
  "security: adversarial checks for implemented trust boundaries",
]

[tool.coverage.run]
branch = true
source = ["agents_should_survive_failure"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
